<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tally — App Screenshots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:         #0b0f14;
      --bg-card:    #111820;
      --bg-raised:  #161e28;
      --border:       rgba(74, 222, 128, 0.18);
      --border-dim:   rgba(74, 222, 128, 0.07);
      --border-ui:    rgba(255, 255, 255, 0.07);
      --green:        #4ade80;
      --green-dim:    rgba(74, 222, 128, 0.09);
      --green-glow:   rgba(74, 222, 128, 0.28);
      --text:         #f0f4f8;
      --text-body:    #b0bec5;
      --text-meta:    #78909c;
      --text-ghost:   #4a5568;
      --display: 'DM Sans', system-ui, sans-serif;
      --sans: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
      --max-w: 1040px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text-body);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 55% at 50% -5%, rgba(10, 38, 44, 0.95) 0%, transparent 55%),
        radial-gradient(ellipse 40% 35% at 85% 65%, rgba(8, 28, 34, 0.45) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74, 222, 128, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 222, 128, 0.022) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
      max-width: var(--max-w);
      margin: 0 auto;
      border-bottom: 1px solid var(--border-dim);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 5px;
      color: var(--green);
      text-decoration: none;
    }

    .nav-logo-icon {
      width: 64px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-right: 10px;
      margin-left: 10px;
    }

    .nav-right { display: flex; align-items: center; gap: 24px; }

    .nav-link {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-meta);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-link:hover { color: var(--green); }

    .nav-breadcrumb span { color: var(--text-ghost); margin: 0 8px; }

    /* PAGE TITLE */
    .page-title {
      position: relative;
      z-index: 1;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 56px 32px 40px;
      animation: fadeUp 0.55s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      border: 1px solid var(--border);
      padding: 6px 14px;
      margin-bottom: 28px;
      background: var(--green-dim);
    }

    .page-title h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2rem, 3.8vw, 3.1rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 12px;
    }

    .page-title h1 em {
      font-style: normal;
      color: var(--green);
    }

    .page-title p {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--text-meta);
      text-transform: uppercase;
    }

    /* GALLERY */
    .gallery {
      position: relative;
      z-index: 1;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 32px 96px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2px;
    }

    .thumb {
      position: relative;
      aspect-ratio: 9/19.5;
      overflow: hidden;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
      filter: brightness(0.88);
    }

    .thumb:hover img {
      transform: scale(1.04);
      filter: brightness(1);
    }

    .thumb:hover {
      border-color: var(--border);
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11,15,20,0.85) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      padding: 16px;
    }

    .thumb:hover .thumb-overlay { opacity: 1; }

    .thumb-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--green);
    }

    .thumb-zoom {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      background: rgba(11,15,20,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .thumb:hover .thumb-zoom { opacity: 1; }

    .thumb-zoom svg {
      width: 11px;
      height: 11px;
      stroke: var(--green);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 20, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .modal-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 32px;
      max-height: 92vh;
    }

    .modal-img-wrap {
      position: relative;
      max-height: 88vh;
      display: flex;
      align-items: center;
    }

    .modal-img-wrap img {
      max-height: 88vh;
      max-width: min(400px, 90vw);
      width: auto;
      display: block;
      border: 1px solid var(--border);
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px var(--green-dim);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal.open .modal-img-wrap img { transform: scale(1); }

    .modal-meta {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 140px;
    }

    .modal-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
    }

    .modal-counter {
      font-family: var(--mono);
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--text-ghost);
      letter-spacing: -0.02em;
    }

    .modal-counter span { color: var(--text); }

    .modal-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .nav-btn {
      background: none;
      border: 1px solid var(--border-dim);
      color: var(--text-meta);
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 16px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      text-align: left;
    }

    .nav-btn:hover {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-dim);
    }

    .close-btn {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: var(--text-meta);
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 8px 0;
      transition: color 0.2s;
    }

    .close-btn:hover { color: var(--green); }

    @media (max-width: 640px) {
      nav, .page-title, .gallery { padding-left: 20px; padding-right: 20px; }
      .gallery { grid-template-columns: repeat(2, 1fr); }
      .modal-meta { display: none; }
      .modal-img-wrap img { max-width: 92vw; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="/start.html">
      <span class="nav-logo-icon"><img src="logo.png" alt="Tally" style="height:32px;width:auto;" /></span>
      TALLY
    </a>
    <div class="nav-right">
      <a class="nav-link" href="/story.html">Story</a>
      <a class="nav-link" href="/integration.html">Integration</a>
      <a class="nav-link" href="https://youtu.be/7ksWSDN4As4" target="_blank">Demo Video ↗</a>
      <a class="nav-link" href="https://x.com/tallyvault" target="_blank">@tallyvault ↗</a>
      <a class="nav-link" href="https://github.com/alexanxin/tally-vault" target="_blank">GitHub ↗</a>
    </div>
  </nav>

  <div class="page-title">
    <div class="page-tag">Android · Solana Mainnet</div>
    <h1>App <em>screenshots.</em></h1>
    <p>13 screens · tap to view full size</p>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="modal" id="modal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-inner">
      <div class="modal-img-wrap">
        <button class="close-btn" id="closeBtn">[ esc ] close</button>
        <img id="modalImg" src="" alt="" />
      </div>
      <div class="modal-meta">
        <div class="modal-label" id="modalLabel"></div>
        <div class="modal-counter"><span id="modalCurrent">1</span> / <span id="modalTotal">10</span></div>
        <div class="modal-nav">
          <button class="nav-btn" id="prevBtn">↑ prev</button>
          <button class="nav-btn" id="nextBtn">↓ next</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const screenshots = [
      { file: 'tally_vault.jpg',       label: 'Home' },
      { file: 'wallets_list.jpg',      label: 'Wallets' },
      { file: 'wallets_expanded.jpg',  label: 'Wallets: Expanded' },
      { file: 'wallets_customize.jpg', label: 'Wallets: Customize' },
      { file: 'agents.jpg',            label: 'Agents' },
      { file: 'setup.jpg',             label: 'Setup Wizard' },
      { file: 'authorize_funding.jpg', label: 'Authorize Funding' },
      { file: 'card_tap.jpg',          label: 'Card Tap' },
      { file: 'funded.jpg',            label: 'Session Funded' },
      { file: 'send.jpg',              label: 'Send' },
      { file: 'receive.jpg',           label: 'Receive' },
      { file: 'convert.jpg',           label: 'Convert' },
      { file: 'settings.jpg',          label: 'Settings' },
    ];

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalLabel = document.getElementById('modalLabel');
    const modalCurrent = document.getElementById('modalCurrent');
    const modalTotal = document.getElementById('modalTotal');

    modalTotal.textContent = screenshots.length;

    let current = 0;

    screenshots.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'thumb';
      div.style.animationDelay = `${i * 60}ms`;
      div.innerHTML = `
        <img src="screenshots/${s.file}" alt="${s.label}" loading="lazy" />
        <div class="thumb-overlay">
          <span class="thumb-label">${s.label}</span>
        </div>
        <div class="thumb-zoom">
          <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </div>
      `;
      div.addEventListener('click', () => openModal(i));
      gallery.appendChild(div);
    });

    function openModal(index) {
      current = index;
      updateModal();
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    function updateModal() {
      const s = screenshots[current];
      modalImg.src = `screenshots/${s.file}`;
      modalImg.alt = s.label;
      modalLabel.textContent = s.label;
      modalCurrent.textContent = current + 1;
    }

    function next() { current = (current + 1) % screenshots.length; updateModal(); }
    function prev() { current = (current - 1 + screenshots.length) % screenshots.length; updateModal(); }

    document.getElementById('nextBtn').addEventListener('click', next);
    document.getElementById('prevBtn').addEventListener('click', prev);
    document.getElementById('closeBtn').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', closeModal);

    document.addEventListener('keydown', e => {
      if (!modal.classList.contains('open')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prev();
    });
  </script>
</body>
</html>
