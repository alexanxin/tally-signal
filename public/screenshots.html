<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tally — App Screenshots</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0c0a;
      --bg2: #0f120f;
      --surface: #141814;
      --border: #1f261f;
      --accent: #7fff00;
      --accent-dim: rgba(127, 255, 0, 0.12);
      --accent-glow: rgba(127, 255, 0, 0.25);
      --text: #e8ede8;
      --text-muted: #6b7a6b;
      --text-dim: #3a463a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      padding: 48px 48px 0;
      display: flex;
      align-items: baseline;
      gap: 24px;
    }

    header a {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }

    header a:hover { color: var(--accent); }

    .header-divider {
      color: var(--text-dim);
      font-size: 12px;
    }

    .page-title {
      position: relative;
      z-index: 1;
      padding: 64px 48px 48px;
    }

    .page-title h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }

    .page-title h1 span {
      color: var(--accent);
    }

    .page-title p {
      margin-top: 16px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .gallery {
      position: relative;
      z-index: 1;
      padding: 0 48px 96px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2px;
    }

    .thumb {
      position: relative;
      aspect-ratio: 9/19.5;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
      filter: brightness(0.9);
    }

    .thumb:hover img {
      transform: scale(1.04);
      filter: brightness(1);
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .thumb:hover .thumb-overlay {
      opacity: 1;
    }

    .thumb-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .thumb-zoom {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .thumb:hover .thumb-zoom { opacity: 1; }

    .thumb-zoom svg {
      width: 12px;
      height: 12px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 24px;
      max-height: 92vh;
    }

    .modal-img-wrap {
      position: relative;
      max-height: 88vh;
      display: flex;
      align-items: center;
    }

    .modal-img-wrap img {
      max-height: 88vh;
      max-width: min(420px, 90vw);
      width: auto;
      display: block;
      border: 1px solid var(--border);
      border-radius: 2px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px var(--accent-dim);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal.open .modal-img-wrap img {
      transform: scale(1);
    }

    .modal-meta {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 140px;
    }

    .modal-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .modal-counter {
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: -0.02em;
    }

    .modal-counter span {
      color: var(--text);
    }

    .modal-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .nav-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 10px 16px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      text-align: left;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .close-btn {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      cursor: pointer;
      padding: 8px 0;
      transition: color 0.2s;
    }

    .close-btn:hover { color: var(--accent); }

    /* staggered entrance */
    .thumb {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      header, .page-title, .gallery { padding-left: 20px; padding-right: 20px; }
      .gallery { grid-template-columns: repeat(2, 1fr); }
      .modal-meta { display: none; }
      .modal-img-wrap img { max-width: 92vw; }
    }
  </style>
</head>
<body>

  <header>
    <a href="/start.html">← tally</a>
    <span class="header-divider">/</span>
    <a href="#">screenshots</a>
  </header>

  <div class="page-title">
    <h1>App <span>screens.</span></h1>
    <p>13 screenshots · Android · Solana mainnet</p>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="modal" id="modal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-inner">
      <div class="modal-img-wrap">
        <button class="close-btn" id="closeBtn">[ esc ] close</button>
        <img id="modalImg" src="" alt="" />
      </div>
      <div class="modal-meta">
        <div class="modal-label" id="modalLabel"></div>
        <div class="modal-counter"><span id="modalCurrent">1</span> / <span id="modalTotal">10</span></div>
        <div class="modal-nav">
          <button class="nav-btn" id="prevBtn">↑ prev</button>
          <button class="nav-btn" id="nextBtn">↓ next</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const screenshots = [
      { file: 'tally_vault.jpg',       label: 'Home — Vault' },
      { file: 'wallets_list.jpg',      label: 'Wallets — List' },
      { file: 'wallets_expanded.jpg',  label: 'Wallets — Expanded' },
      { file: 'wallets_customize.jpg', label: 'Wallets — Customize' },
      { file: 'agents.jpg',            label: 'Agents' },
      { file: 'setup.jpg',             label: 'Setup Wizard' },
      { file: 'authorize_funding.jpg', label: 'Authorize Funding' },
      { file: 'card_tap.jpg',          label: 'Card Tap' },
      { file: 'funded.jpg',            label: 'Session Funded' },
      { file: 'send.jpg',              label: 'Send' },
      { file: 'receive.jpg',           label: 'Receive' },
      { file: 'convert.jpg',           label: 'Convert' },
      { file: 'settings.jpg',          label: 'Settings' },
    ];

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalLabel = document.getElementById('modalLabel');
    const modalCurrent = document.getElementById('modalCurrent');
    const modalTotal = document.getElementById('modalTotal');

    modalTotal.textContent = screenshots.length;

    let current = 0;

    screenshots.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'thumb';
      div.style.animationDelay = `${i * 60}ms`;
      div.innerHTML = `
        <img src="screenshots/${s.file}" alt="${s.label}" loading="lazy" />
        <div class="thumb-overlay">
          <span class="thumb-label">${s.label}</span>
        </div>
        <div class="thumb-zoom">
          <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </div>
      `;
      div.addEventListener('click', () => openModal(i));
      gallery.appendChild(div);
    });

    function openModal(index) {
      current = index;
      updateModal();
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    function updateModal() {
      const s = screenshots[current];
      modalImg.src = `screenshots/${s.file}`;
      modalImg.alt = s.label;
      modalLabel.textContent = s.label;
      modalCurrent.textContent = current + 1;
    }

    function next() { current = (current + 1) % screenshots.length; updateModal(); }
    function prev() { current = (current - 1 + screenshots.length) % screenshots.length; updateModal(); }

    document.getElementById('nextBtn').addEventListener('click', next);
    document.getElementById('prevBtn').addEventListener('click', prev);
    document.getElementById('closeBtn').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', closeModal);

    document.addEventListener('keydown', e => {
      if (!modal.classList.contains('open')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prev();
    });
  </script>
</body>
</html>
